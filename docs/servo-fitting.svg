<text x="930.3" y="362.0" font-size="13" font-weight="normal" fill="#2563eb" text-anchor="middle">femur servo</text>
<text x="1053.9" y="213.6" font-size="13" font-weight="normal" fill="#ea580c" text-anchor="end">tibia servo</text>
<text x="1303.9" y="412.9" font-size="13" font-weight="normal" fill="#4b5563" text-anchor="middle">foot</text>
<text x="780.0" y="432.0" font-size="14" font-weight="normal" fill="#111827" text-anchor="start"><tspan font-weight='bold' fill='#2563eb'>35°</tspan>: thigh above horizontal.</text>
<text x="780.0" y="454.0" font-size="14" font-weight="normal" fill="#111827" text-anchor="start"><tspan font-weight='bold' fill='#ea580c'>112° inside</tspan>: the knee angle you put the protractor on (68° fold from straight).</text>
<text x="780.0" y="476.0" font-size="14" font-weight="normal" fill="#111827" text-anchor="start">The shin points 33° below horizontal.</text>
<text x="780.0" y="540.0" font-size="22" font-weight="bold" fill="#111827" text-anchor="start">3. For each servo</text>
<text x="780.0" y="576.0" font-size="15" font-weight="normal" fill="#111827" text-anchor="start">1. Tester: Pulse Width 50H, Select to neutral, display reads 1500.</text>
<text x="780.0" y="602.0" font-size="15" font-weight="normal" fill="#111827" text-anchor="start">2. Plug the servo into OUT 1: orange top, red middle, brown bottom.</text>
<text x="780.0" y="628.0" font-size="15" font-weight="normal" fill="#111827" text-anchor="start">3. Hold the joint at its angle: coxa straight out, thigh 35° up,</text>
<text x="806.0" y="654.0" font-size="15" font-weight="normal" fill="#111827" text-anchor="start">knee 112° inside angle.</text>
<text x="780.0" y="680.0" font-size="15" font-weight="normal" fill="#111827" text-anchor="start">4. Push the horn onto the nearest spline tooth. 25 teeth = 14.4° apart,</text>
<text x="806.0" y="706.0" font-size="15" font-weight="normal" fill="#111827" text-anchor="start">so you will land within about 7°. Do not move the servo shaft.</text>
<text x="780.0" y="732.0" font-size="15" font-weight="normal" fill="#111827" text-anchor="start">5. Screw the horn down. Unplug. Next servo.</text>
<text x="780.0" y="758.0" font-size="15" font-weight="normal" fill="#111827" text-anchor="start">6. Write down how far each joint lands from its angle, e.g. "R2 tibia +5°".</text>
<text x="806.0" y="784.0" font-size="15" font-weight="normal" fill="#111827" text-anchor="start">It gets trimmed in the config: 11 µs per degree.</text>
<text x="780.0" y="828.0" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="start">Never fit a horn with the servo unpowered: the shaft may not be at centre.</text>
</svg>