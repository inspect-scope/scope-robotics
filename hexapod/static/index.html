<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Hexapod</title>
<style>
:root {
  color-scheme: dark;
  --plane:      #0d0d0d;
  --surface:    #1a1a19;
  --grid:       #2c2c2a;
  --baseline:   #383835;
  --ink:        #ffffff;
  --ink-2:      #c3c2b7;
  --muted:      #898781;
  --accent:     #3987e5;
  --track:      #184f95;
  --good:       #0ca30c;
  --warning:    #fab219;
  --serious:    #ec835a;
  --critical:   #d03b3b;
  --radius:     10px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
body {
  background: var(--plane); color: var(--ink);
  font: 15px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  touch-action: manipulation; user-select: none;
}

/* --- top bar --- */
header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-bottom: 1px solid var(--grid); background: var(--surface);
}
.brand { font-weight: 600; letter-spacing: .2px; }
.link { display: flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 13px; margin-left: auto; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--good); } .dot.bad { background: var(--critical); }
button {
  font: inherit; color: var(--ink); background: var(--grid);
  border: 1px solid var(--baseline); border-radius: var(--radius);
  padding: 9px 14px; cursor: pointer;
}
button:active { background: var(--baseline); }
button[disabled] { opacity: .4; cursor: default; }
button.on { background: var(--accent); border-color: var(--accent); }
#estop {
  background: var(--critical); border-color: var(--critical); color: #fff;
  font-weight: 700; letter-spacing: .6px; padding: 9px 18px;
}
#estop.latched { background: var(--surface); color: var(--critical); }

/* --- stat tiles --- */
.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 2px; background: var(--grid); border-bottom: 1px solid var(--grid);
}
.tile { background: var(--surface); padding: 10px 14px 12px; }
.tile .label { color: var(--muted); font-size: 12px; }
.tile .value { font-size: 26px; font-weight: 600; line-height: 1.15; margin-top: 2px; }
.tile .value .unit { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
.tile .note { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
.meter { height: 6px; border-radius: 3px; overflow: hidden; margin: 7px 0 5px;
  background: color-mix(in oklab, var(--fill, var(--accent)) 26%, var(--surface)); }
.meter > i { display: block; height: 100%; border-radius: 3px; background: var(--fill, var(--accent));
  width: 0; transition: width .3s, background .3s; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.icon { width: 10px; height: 10px; border-radius: 2px; flex: none; }

/* --- feet --- */
.feet { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--grid); background: var(--surface); }
.foot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.foot .dot { width: 8px; height: 8px; }
.foot.down { color: var(--ink-2); } .foot.down .dot { background: var(--good); }
.foot.limited .dot { background: var(--warning); }

/* --- main --- */
main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 12px 14px 16px; min-height: 0; overflow-y: auto; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.visuals { display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch; }
.view { flex: 1 1 320px; min-width: 0; position: relative; background: var(--surface); border: 1px solid var(--grid);
  border-radius: var(--radius); overflow: hidden; aspect-ratio: 16 / 9; max-height: 400px; display: flex; align-items: center; justify-content: center; }
.view img { width: 100%; height: 100%; object-fit: contain; display: block; }
.view img:not([src]) { display: none; }
.view .nocam { position: absolute; color: var(--muted); font-size: 13px; }
.view .bar { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 8px; align-items: center; }
.view .bar .cap:empty { display: none; }
.view .bar .cap { font-size: 12px; color: var(--ink-2); background: rgba(13,13,13,.7); padding: 4px 8px; border-radius: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#capture { background: var(--accent); border-color: var(--accent); font-weight: 600; }
#capture.busy { opacity: .6; }
.stage { flex: 1 1 260px; display: flex; align-items: center; justify-content: center; min-height: 210px; }
.stage svg { height: 100%; width: auto; max-width: 100%; max-height: 340px; }
.pads { display: flex; gap: 24px; justify-content: space-between; align-items: center; }
.pad-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pad-wrap .cap { font-size: 12px; color: var(--muted); }
.pad {
  width: 168px; height: 168px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--baseline);
  position: relative; touch-action: none;
}
.pad.wide { border-radius: var(--radius); width: 168px; height: 168px; }
.pad::after {
  content: ""; position: absolute; inset: 0; margin: auto; width: 1px; height: 1px;
  box-shadow: 0 0 0 1px var(--grid); border-radius: 50%;
}
.knob {
  position: absolute; width: 62px; height: 62px; border-radius: 50%;
  background: var(--accent); left: 50%; top: 50%; transform: translate(-50%, -50%);
  box-shadow: 0 0 0 2px var(--surface); pointer-events: none;
}
.pad.wide::before {
  content: ""; position: absolute; left: 16px; right: 16px; top: 50%;
  height: 2px; margin-top: -1px; border-radius: 1px; background: var(--grid);
}

details { background: var(--surface); border: 1px solid var(--grid); border-radius: var(--radius); }
summary { padding: 10px 14px; cursor: pointer; color: var(--ink-2); font-size: 14px; }
.sliders { padding: 4px 14px 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }
.slider { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; }
.slider label { font-size: 12px; color: var(--muted); }
.slider output { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }

#banner { display: none; padding: 8px 14px; font-size: 13px; gap: 7px; align-items: center; }
#banner.show { display: flex; }
@media (max-width: 430px) { .pad, .pad.wide { width: 138px; height: 138px; } .stage { min-height: 170px; } }
@media (min-width: 760px) { .pads { justify-content: center; gap: 64px; } }
</style>
</head>
<body>

<header>
  <span class="brand">Hexapod</span>
  <span class="link"><span class="dot" id="link-dot"></span><span id="link-text">connecting</span></span>
  <button id="estop" title="Space">E-STOP</button>
</header>

<div id="banner"><span class="icon" style="background:var(--warning)"></span><span id="banner-text"></span></div>

<section class="stats">
  <div class="tile">
    <div class="label">Battery</div>
    <div class="value"><span id="volts">--</span><span class="unit">V</span></div>
    <div class="meter"><i id="volts-bar"></i></div>
    <div class="note"><span class="icon" id="volts-icon"></span><span id="volts-state">no data</span></div>
  </div>
  <div class="tile">
    <div class="label">Servo current</div>
    <div class="value"><span id="amps">--</span><span class="unit">A</span></div>
    <div class="meter"><i id="amps-bar"></i></div>
    <div class="note"><span class="icon" id="amps-icon"></span><span id="amps-state">no data</span></div>
  </div>
  <div class="tile">
    <div class="label">Control loop</div>
    <div class="value"><span id="hz">--</span><span class="unit">Hz</span></div>
    <div class="note"><span id="tele-age">telemetry --</span></div>
  </div>
  <div class="tile">
    <div class="label">Attitude</div>
    <div class="value"><span id="pitch">--</span><span class="unit">pitch</span> <span id="roll">--</span><span class="unit">roll</span></div>
    <div class="note"><span class="icon" id="imu-icon"></span><span id="imu-state">no data</span></div>
  </div>
  <div class="tile">
    <div class="label">State</div>
    <div class="value"><span class="badge"><span class="icon" id="state-icon"></span><span id="state">--</span></span></div>
    <div class="note"><span id="speed">0 mm/s &middot; 0 &deg;/s</span></div>
  </div>
</section>

<section class="feet" id="feet"></section>

<main>
  <div class="row">
    <button id="stand">Stand</button>
    <button id="sit">Sit</button>
    <button id="torque">Torque</button>
    <button id="clear" style="margin-left:auto">Clear e-stop</button>
  </div>

  <div class="visuals">
    <div class="view" id="view">
      <span class="nocam" id="nocam">no camera</span>
      <img id="live" alt="live view">
      <div class="bar">
        <button id="capture" title="C">Capture</button>
        <span class="cap" id="capture-note"></span>
      </div>
    </div>
    <div class="stage">
      <svg id="stance" viewBox="-300 -300 600 600" aria-label="Top-down view of foot positions"></svg>
    </div>
  </div>

  <div class="pads">
    <div class="pad-wrap">
      <div class="pad" id="pad-move"><div class="knob"></div></div>
      <span class="cap">Move &middot; W A S D</span>
    </div>
    <div class="pad-wrap">
      <div class="pad wide" id="pad-turn"><div class="knob"></div></div>
      <span class="cap">Turn &middot; Q E</span>
    </div>
  </div>

  <details>
    <summary>Posture &amp; gait</summary>
    <div class="sliders" id="sliders"></div>
  </details>
</main>

<script>
const $ = (id) => document.getElementById(id);
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

/* ---------------- link ---------------- */
let sock = null, linked = false;
const drive = { vx: 0, vy: 0, yaw: 0 };

function send(msg) { if (linked) sock.send(JSON.stringify(msg)); }

function connect() {
  sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  sock.onopen = () => { linked = true; setLink(true); loadConfig(); };
  sock.onclose = () => { linked = false; setLink(false); setTimeout(connect, 1000); };
  sock.onerror = () => sock.close();
  sock.onmessage = (ev) => { const m = JSON.parse(ev.data); if (m.type === "state") render(m); };
}
function setLink(up) {
  $("link-dot").className = "dot " + (up ? "ok" : "bad");
  $("link-text").textContent = up ? "connected" : "reconnecting";
}
// Stream unconditionally: the controller expires the web source after 0.5 s, so a
// steady stream doubles as the liveness signal. Stop sending and the robot halts.
setInterval(() => send({ type: "drive", ...drive }), 50);

/* ---------------- thumb pads ---------------- */
function pad(el, onMove, axes) {
  const knob = el.querySelector(".knob");
  let id = null;
  const place = (x, y) => {
    knob.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  };
  const update = (ev) => {
    const r = el.getBoundingClientRect();
    const rx = clamp((ev.clientX - r.left - r.width / 2) / (r.width / 2), -1, 1);
    const ry = clamp((ev.clientY - r.top - r.height / 2) / (r.height / 2), -1, 1);
    let nx = rx, ny = axes === "x" ? 0 : ry;
    if (axes !== "x") {
      const mag = Math.hypot(nx, ny);
      if (mag > 1) { nx /= mag; ny /= mag; }
    }
    place(nx * (r.width / 2 - 34), ny * (r.height / 2 - 34));
    onMove(nx, -ny); // screen y is down; robot +y is forward
  };
  el.addEventListener("pointerdown", (ev) => {
    if (id !== null) return;
    id = ev.pointerId; el.setPointerCapture(id); update(ev);
  });
  el.addEventListener("pointermove", (ev) => { if (ev.pointerId === id) update(ev); });
  const release = (ev) => {
    if (ev.pointerId !== id) return;
    id = null; place(0, 0); onMove(0, 0);
  };
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
}
pad($("pad-move"), (x, y) => { drive.vx = round2(x); drive.vy = round2(y); });
pad($("pad-turn"), (x) => { drive.yaw = round2(-x); }, "x"); // stick right = turn right = clockwise
const round2 = (v) => Math.round(v * 100) / 100;

/* ---------------- keyboard ---------------- */
const held = new Set();
const KEYS = { w: "vy+", s: "vy-", d: "vx+", a: "vx-", q: "yaw+", e: "yaw-" };
addEventListener("keydown", (ev) => {
  const key = ev.key.toLowerCase();
  if (key === " ") { ev.preventDefault(); return estop(); }
  if (key === "c" && !ev.repeat) { ev.preventDefault(); return capture(); }
  if (KEYS[key]) { held.add(key); ev.preventDefault(); applyKeys(); }
});
addEventListener("keyup", (ev) => {
  const key = ev.key.toLowerCase();
  if (KEYS[key]) { held.delete(key); applyKeys(); }
});
addEventListener("blur", () => { held.clear(); applyKeys(); });
function applyKeys() {
  if (!held.size && !keysOwn) return;
  keysOwn = held.size > 0;
  const axis = { vx: 0, vy: 0, yaw: 0 };
  held.forEach((key) => {
    const [name, sign] = [KEYS[key].slice(0, -1), KEYS[key].slice(-1) === "+" ? 1 : -1];
    axis[name] = sign;
  });
  Object.assign(drive, axis);
}
let keysOwn = false;

/* ---------------- buttons ---------------- */
function estop() { send({ type: "estop" }); fetch("/api/estop", { method: "POST" }).catch(() => {}); }
$("estop").onclick = estop;
$("clear").onclick = () => send({ type: "clear_estop" });
$("stand").onclick = () => send({ type: "stand" });
$("sit").onclick = () => send({ type: "sit" });
$("torque").onclick = () => send({ type: "torque", on: !$("torque").classList.contains("on") });

/* ---------------- camera ---------------- */
// The <img> holds one long-lived HTTP connection to /stream. Set src once when the
// camera comes up and drop it when the camera goes away, so a dead camera is a
// message, not a broken-image icon.
let liveOn = false;
function setLive(on) {
  if (on === liveOn) return;
  liveOn = on;
  if (on) $("live").src = "/stream?" + Date.now(); else $("live").removeAttribute("src");
  $("nocam").style.display = on ? "none" : "";
  $("capture").disabled = !on;
}
$("live").onerror = () => { if (liveOn) { liveOn = false; setTimeout(() => setLive(true), 2000); } };
async function capture() {
  const button = $("capture");
  if (button.disabled || button.classList.contains("busy")) return;
  button.classList.add("busy");
  try {
    const r = await fetch("/capture", { method: "POST" });
    const body = await r.json();
    $("capture-note").textContent = r.ok ? `saved ${body.path.split("/").pop()} (${(body.bytes / 1e6).toFixed(1)} MB)` : `capture failed: ${body.detail}`;
  } catch (e) {
    $("capture-note").textContent = "capture failed: no reply";
  } finally {
    button.classList.remove("busy");
  }
}
$("capture").onclick = capture;

/* ---------------- sliders ---------------- */
const SLIDERS = [
  { key: "height", label: "Ride height", unit: "mm", min: 40, max: 105, step: 1, msg: (v) => ({ type: "height", value: v }) },
  { key: "pitch",  label: "Pitch",       unit: "°", min: -8, max: 8, step: 0.5, msg: (v) => ({ type: "pose", pitch: v }) },
  { key: "roll",   label: "Roll",        unit: "°", min: -8, max: 8, step: 0.5, msg: (v) => ({ type: "pose", roll: v }) },
  { key: "yaw",    label: "Body yaw",    unit: "°", min: -8, max: 8, step: 0.5, msg: (v) => ({ type: "pose", yaw: v }) },
  { key: "x",      label: "Body shift X", unit: "mm", min: -15, max: 15, step: 1, msg: (v) => ({ type: "pose", x: v }) },
  { key: "y",      label: "Body shift Y", unit: "mm", min: -15, max: 15, step: 1, msg: (v) => ({ type: "pose", y: v }) },
  { key: "cycle_s",   label: "Gait cycle", unit: "s", min: 0.3, max: 2.0, step: 0.05, msg: (v) => ({ type: "gait", cycle_s: v }) },
  { key: "step_lift", label: "Step lift",  unit: "mm", min: 5, max: 70, step: 1, msg: (v) => ({ type: "gait", step_lift: v }) },
  { key: "max_speed", label: "Top speed",  unit: "mm/s", min: 20, max: 250, step: 5, msg: (v) => ({ type: "gait", max_speed: v }) },
];
const inputs = {};
for (const spec of SLIDERS) {
  const wrap = document.createElement("div");
  wrap.className = "slider";
  wrap.innerHTML = `<label for="s-${spec.key}">${spec.label}</label><output id="o-${spec.key}"></output>`;
  const input = document.createElement("input");
  Object.assign(input, { type: "range", id: "s-" + spec.key, min: spec.min, max: spec.max, step: spec.step });
  const show = () => { $("o-" + spec.key).textContent = `${input.value} ${spec.unit}`; };
  input.oninput = () => { show(); send(spec.msg(parseFloat(input.value))); };
  wrap.appendChild(input);
  $("sliders").appendChild(wrap);
  inputs[spec.key] = { input, show };
}
function retune(key, min, max) {
  const entry = inputs[key];
  if (entry) { entry.input.min = min; entry.input.max = max; }
}
function setSlider(key, value) {
  const entry = inputs[key];
  if (!entry || document.activeElement === entry.input) return;
  entry.input.value = value; entry.show();
}
async function loadConfig() {
  const cfg = await (await fetch("/api/config")).json();
  const lim = cfg.pose_limits;
  retune("height", cfg.height.min, cfg.height.max);
  ["roll", "pitch", "yaw"].forEach((k) => retune(k, -lim[k], lim[k]));
  ["x", "y"].forEach((k) => retune(k, -lim.shift, lim.shift));
  setSlider("height", cfg.height.default);
  setSlider("cycle_s", cfg.gait.cycle_s);
  setSlider("step_lift", cfg.gait.step_lift);
  setSlider("max_speed", cfg.gait.max_speed);
  ["pitch", "roll", "yaw", "x", "y"].forEach((k) => setSlider(k, 0));
  $("feet").innerHTML = cfg.legs.map((n) =>
    `<span class="foot" id="foot-${n}"><span class="dot"></span>${n}</span>`).join("");
  buildStance(cfg.legs, cfg.coxae);
}

/* ---------------- top-down stance view ---------------- */
const SVG = "http://www.w3.org/2000/svg";
const stance = { legs: {}, ready: false };

function node(tag, attrs) {
  const el = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function buildStance(names, coxae) {
  const svg = $("stance");
  svg.textContent = "";
  stance.legs = {};

  const ring = (r, dash) => node("circle", { cx: 0, cy: 0, r, fill: "none",
    stroke: "var(--grid)", "stroke-width": 1.5, "stroke-dasharray": dash });
  svg.append(ring(220, "4 8"));

  // Body outline through the coxa centres, drawn front-first so the shape reads.
  const ordered = [...names].sort((a, b) => Math.atan2(coxae[b][1], coxae[b][0]) - Math.atan2(coxae[a][1], coxae[a][0]));
  svg.append(node("polygon", {
    points: ordered.map((n) => `${coxae[n][0]},${-coxae[n][1]}`).join(" "),
    fill: "var(--surface)", stroke: "var(--baseline)", "stroke-width": 2,
  }));
  svg.append(node("polygon", { points: "0,-118 -13,-96 13,-96", fill: "var(--baseline)" }));  // nose

  const heading = node("line", { x1: 0, y1: 0, x2: 0, y2: 0,
    stroke: "var(--accent)", "stroke-width": 4, "stroke-linecap": "round" });
  svg.append(heading);
  stance.heading = heading;

  for (const name of names) {
    const [cx, cy] = coxae[name];
    const bone = node("line", { x1: cx, y1: -cy, x2: cx, y2: -cy,
      stroke: "var(--baseline)", "stroke-width": 5, "stroke-linecap": "round" });
    const ghost = node("circle", { r: 4, fill: "var(--grid)" });
    const foot = node("circle", { r: 11, fill: "var(--muted)", stroke: "var(--surface)", "stroke-width": 2 });
    const tag = node("text", { "font-size": 30, fill: "var(--muted)", "text-anchor": "middle" });
    tag.textContent = name;
    svg.append(bone, ghost, foot, tag);
    stance.legs[name] = { bone, ghost, foot, tag, coxa: [cx, cy] };
  }
  stance.ready = true;
}

function drawStance(s) {
  if (!stance.ready) return;
  const lifted = new Set(s.limited_legs || []);
  for (const [name, leg] of Object.entries(stance.legs)) {
    const point = (s.feet || {})[name];
    if (!point) continue;
    const [x, y, z] = point;
    const lift = Math.max(0, z + s.height);          // mm above the ground plane
    const down = (s.contacts || {})[name] && lift < 1;
    leg.bone.setAttribute("x2", x); leg.bone.setAttribute("y2", -y);
    leg.foot.setAttribute("cx", x); leg.foot.setAttribute("cy", -y);
    leg.tag.setAttribute("x", x * 1.2); leg.tag.setAttribute("y", -y * 1.2 + 10);
    leg.ghost.setAttribute("cx", x); leg.ghost.setAttribute("cy", -y);
    // A foot in the air grows and goes hollow; a foot taking load is solid green.
    leg.foot.setAttribute("r", 11 + lift * 0.14);
    leg.foot.setAttribute("fill", lifted.has(name) ? "var(--warning)" : down ? "var(--good)" : "var(--surface)");
    leg.foot.setAttribute("stroke", lifted.has(name) ? "var(--warning)" : lift > 1 ? "var(--accent)" : "var(--muted)");
    leg.bone.setAttribute("stroke", lift > 1 ? "var(--grid)" : "var(--baseline)");
  }
  const scale = 1.1;
  stance.heading.setAttribute("x2", s.velocity.vx * scale);
  stance.heading.setAttribute("y2", -s.velocity.vy * scale);
  stance.heading.setAttribute("opacity", Math.hypot(s.velocity.vx, s.velocity.vy) > 2 ? 1 : 0);
}

/* ---------------- render ---------------- */
const STATE_COLOR = { walking: "--accent", standing: "--good", sitting: "--ink-2", off: "--muted", estop: "--critical" };
// Status thresholds mirror WARN_VOL / WARN_CUR in the Chica config.
function volt_status(v) {
  if (v === null) return ["--muted", "no data"];
  if (v < 6.0) return ["--critical", "shut off"];
  if (v < 6.4) return ["--warning", "low"];
  return ["--good", "ok"];
}
function amp_status(a) {
  if (a === null) return ["--muted", "no data"];
  if (a > 10) return ["--critical", "over limit"];
  if (a > 8) return ["--warning", "high"];
  return ["--good", "ok"];
}
const fmt = (v, digits) => v === null || v === undefined ? "--" : v.toFixed(digits);

function meter(key, value, [color, label], pct) {
  const bar = $(key + "-bar");
  $(key + "-icon").style.background = `var(${color})`;
  $(key + "-state").textContent = label;
  bar.parentElement.style.setProperty("--fill", `var(${color})`);
  bar.style.width = value === null ? "0%" : clamp(pct(value), 0, 100) + "%";
}

function render(s) {
  $("volts").textContent = fmt(s.volts, 2);
  $("amps").textContent = fmt(s.amps, 2);
  $("hz").textContent = fmt(s.loop_hz, 0);

  meter("volts", s.volts, volt_status(s.volts), (v) => (v - 5.5) / (8.4 - 5.5) * 100);
  meter("amps", s.amps, amp_status(s.amps), (v) => v / 12 * 100);

  $("state").textContent = s.state;
  $("state-icon").style.background = `var(${STATE_COLOR[s.state] || "--muted"})`;
  const speed = Math.hypot(s.velocity.vx, s.velocity.vy);
  $("speed").textContent = `${speed.toFixed(0)} mm/s · ${s.velocity.yaw_rate.toFixed(0)} °/s`;
  $("tele-age").textContent = s.telemetry_age_s < 0 ? "telemetry --" : `telemetry ${s.telemetry_age_s.toFixed(1)} s ago`;

  const imu = s.imu || {};
  $("pitch").textContent = imu.ok ? `${imu.pitch.toFixed(1)}°` : "--";
  $("roll").textContent = imu.ok ? `${imu.roll.toFixed(1)}°` : "--";
  $("imu-icon").style.background = `var(${imu.ok ? "--good" : imu.calibrating ? "--warning" : "--muted"})`;
  $("imu-state").textContent = (imu.ok ? `gyro ${(imu.gyro || []).map((g) => g.toFixed(0)).join(" ")} °/s`
    : imu.calibrating ? "calibrating, hold still" : imu.error ? "offline" : "no data")
    + (imu.read_errors ? ` · ${imu.read_errors} bus errors, ${imu.read_failures} unrecovered` : "");
  setLive(!!(s.camera && s.camera.ok));
  if (s.camera && !s.camera.ok) $("nocam").textContent = s.camera.error ? `camera: ${s.camera.error}` : "no camera";

  $("torque").classList.toggle("on", s.torque);
  $("estop").classList.toggle("latched", s.estopped);
  $("clear").disabled = !s.estopped;
  setSlider("height", s.height);

  for (const [name, down] of Object.entries(s.contacts || {})) {
    const el = $("foot-" + name);
    if (el) el.classList.toggle("down", down);
  }
  document.querySelectorAll(".foot").forEach((el) => el.classList.remove("limited"));
  (s.limited_legs || []).forEach((n) => $("foot-" + n)?.classList.add("limited"));

  const problems = [];
  if (!s.connected) problems.push(s.error ? `board offline: ${s.error}` : "board offline");
  if (s.limited_legs?.length) problems.push(`pose limited on ${s.limited_legs.join(", ")}`);
  if (s.estopped) problems.push(s.safety_trip ? `safety trip: ${s.safety_trip}. Find the cause before clearing` : "e-stop latched, clear it before standing");
  if (imu.error && !imu.ok && !imu.calibrating) problems.push(`imu: ${imu.error}`);
  drawStance(s);
  $("banner").classList.toggle("show", problems.length > 0);
  $("banner-text").textContent = problems.join(" · ");
}

connect();
</script>
</body>
</html>
