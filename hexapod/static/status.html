<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<title>Hexapod status</title>
<style>
:root {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --grid: #2c2c2a; --baseline: #383835;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --accent: #3987e5; --sky: #1e4f8a; --ground: #5a3a1c;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
  --frame: 8px;  /* the foot-switch frame round the screen edge */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--plane); color: var(--ink); cursor: none; user-select: none;
  font: 15px/1.3 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto 1fr auto auto;
  gap: 8px; padding: calc(10px + var(--frame)) calc(12px + var(--frame)) calc(12px + var(--frame));
}
body > * { min-width: 0; }
.num { font-variant-numeric: tabular-nums; }

header { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--good); } .dot.bad { background: var(--critical); } .dot.warn { background: var(--warning); }
#state { margin-left: auto; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--ink); }
#state.estop { color: var(--critical); } #state.walking { color: var(--accent); } #state.standing { color: var(--good); }

.volts { text-align: center; padding: 2px 0 0; }
.volts .big { font-size: 78px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
.volts .big .unit { font-size: 28px; font-weight: 500; color: var(--ink-2); margin-left: 4px; }
.volts .sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
.volts.low .big { color: var(--warning); } .volts.dead .big { color: var(--critical); }

.row { display: grid; grid-template-columns: minmax(0, 104px) minmax(0, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.tile .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.tile .value { font-size: 24px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .value .unit { font-size: 13px; color: var(--ink-2); margin-left: 2px; }
.tile.ip .value { font-size: 17px; font-family: ui-monospace, Menlo, monospace; letter-spacing: -.2px; }

.horizon { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 0; }
.horizon svg { height: 100%; max-height: 150px; width: auto; }
.pr { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.pr b { display: block; font-size: 22px; color: var(--ink); font-weight: 600; }

#err { font-size: 12px; color: var(--warning); min-height: 15px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#stop {
  font: inherit; font-size: 26px; font-weight: 800; letter-spacing: 2px;
  color: #fff; background: var(--critical); border: 0; border-radius: 12px; height: 74px; width: 100%;
}
#stop:active { filter: brightness(.8); }
#stop.latched { background: var(--surface); color: var(--critical); border: 2px solid var(--critical); }

/* Foot switches as a frame: each leg owns the stretch of screen edge on its side
   of the robot. Green while its switch is closed; dashed while there is no data. */
#frame { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1; }
#frame path { fill: none; stroke: var(--baseline); stroke-width: var(--frame); }
#frame path.down { stroke: var(--good); }
#frame path.unknown { stroke: var(--grid); stroke-dasharray: 4 6; }

/* The panel on the robot is a 320x480 ST7796S mounted on its side, so the
   compositor runs it rotated and the page gets 480x320. Everything still has
   to be visible at a glance: readings left, horizon right, STOP across. */
@media (orientation: landscape) {
  body {
    grid-template-columns: minmax(0, 1fr) minmax(0, 196px);
    grid-template-rows: auto minmax(0, 1fr) auto auto auto;
    grid-template-areas:
      "head    head"
      "volts   horizon"
      "row     horizon"
      "err     err"
      "stop    stop";
    gap: 6px 10px;
    padding: calc(6px + var(--frame)) calc(10px + var(--frame)) calc(8px + var(--frame));
  }
  header { grid-area: head; }
  .volts { grid-area: volts; align-self: center; }
  .row { grid-area: row; }
  .horizon { grid-area: horizon; }
  #err { grid-area: err; }
  #stop { grid-area: stop; }

  .volts .big { font-size: 62px; }
  .volts .big .unit { font-size: 22px; }
  /* Narrower current tile: the address has to fit whole, it is what you type. */
  .row { grid-template-columns: minmax(0, 84px) minmax(0, 1fr); gap: 6px; }
  .tile .value { font-size: 20px; }
  .tile.ip .value { font-size: 15px; }
  .horizon { gap: 8px; }
  .horizon svg { max-height: 138px; }
  .pr { font-size: 12px; gap: 4px; }
  .pr b { font-size: 18px; }
  #stop { height: 56px; font-size: 22px; }
}
</style>
</head>
<body>

<svg id="frame" aria-hidden="true"></svg>

<header>
  <span class="dot" id="link"></span><span id="link-text">connecting</span>
  <span id="state">--</span>
</header>

<div class="volts" id="volts-box">
  <div class="big num"><span id="volts">--.--</span><span class="unit">V</span></div>
  <div class="sub" id="volts-note">no telemetry</div>
</div>

<div class="row">
  <div class="tile">
    <div class="label">Current</div>
    <div class="value num"><span id="amps">--</span><span class="unit">A</span></div>
  </div>
  <div class="tile ip">
    <div class="label">Address</div>
    <div class="value" id="ip">--</div>
  </div>
</div>

<div class="horizon">
  <svg viewBox="-100 -100 200 200" aria-label="Attitude">
    <defs><clipPath id="disc"><circle r="90"/></clipPath></defs>
    <g clip-path="url(#disc)">
      <g id="att">
        <rect x="-300" y="-600" width="600" height="600" fill="var(--sky)"/>
        <rect x="-300" y="0" width="600" height="600" fill="var(--ground)"/>
        <line x1="-300" y1="0" x2="300" y2="0" stroke="#fff" stroke-width="2"/>
        <g stroke="rgba(255,255,255,.55)" stroke-width="1.5" id="ladder"></g>
      </g>
    </g>
    <circle r="90" fill="none" stroke="var(--baseline)" stroke-width="2"/>
    <path d="M-40 0 H-12 M12 0 H40" stroke="var(--warning)" stroke-width="4" stroke-linecap="round"/>
    <circle r="3.5" fill="var(--warning)"/>
    <polygon points="0,-90 -6,-78 6,-78" fill="var(--ink-2)"/>
  </svg>
  <div class="pr">
    <span>Pitch<b class="num" id="pitch">--</b></span>
    <span>Roll<b class="num" id="roll">--</b></span>
  </div>
</div>

<div id="err"></div>
<button id="stop">STOP</button>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (v, d) => (v === null || v === undefined) ? "--" : v.toFixed(d);
const PX_PER_DEG = 2.2;

// Pitch ladder: a tick every 10 degrees.
for (let d = -60; d <= 60; d += 10) {
  if (d === 0) continue;
  const y = -d * PX_PER_DEG, w = d % 20 === 0 ? 24 : 12;
  $("ladder").insertAdjacentHTML("beforeend", `<line x1="${-w}" y1="${y}" x2="${w}" y2="${y}"/>`);
}

function setLink(up) {
  linked = up;
  $("link").className = "dot " + (up ? "ok" : "bad");
  $("link-text").textContent = up ? "link" : "no link";
}

let sock, linked = false, lastMessage = 0;
function connect() {
  sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/telemetry");
  sock.onopen = () => { setLink(true); loadFrame(); };  // a restarted server may carry a new layout
  sock.onclose = () => { setLink(false); setTimeout(connect, 1000); };
  sock.onerror = () => sock.close();
  sock.onmessage = (ev) => { lastMessage = Date.now(); if (!linked) setLink(true); render(JSON.parse(ev.data)); };
}
// A socket that is open but silent is as bad as a closed one.
setInterval(() => { if (linked && lastMessage && Date.now() - lastMessage > 3000) setLink(false); }, 1000);

// Foot-switch frame. Layout from /api/config: each leg's mount point, and which
// screen edge faces the robot's front. A ray from the screen centre towards a leg
// marks its spot on the edge; each leg owns the edge halfway to its neighbours.
const FRAME_GAP = 10;  // px left between neighbouring legs
const SVG_NS = "http://www.w3.org/2000/svg";
let frameConfig = null, framePaths = {}, lastState = null;

function toScreen(x, y, front) {  // body frame (+X right, +Y forward) to screen (y down), seen from above
  return { top: [x, -y], bottom: [-x, y], left: [-y, -x], right: [y, x] }[front] || [x, -y];
}

function drawFrame() {
  const svg = $("frame");
  if (!frameConfig) return;
  const W = innerWidth, H = innerHeight;
  const half = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--frame")) || 8) / 2;
  const x0 = half, y0 = half, x1 = W - half, y1 = H - half, w = x1 - x0, ht = y1 - y0, P = 2 * (w + ht);
  const wrap = (s) => ((s % P) + P) % P;
  const at = (s) => {  // point at distance s clockwise round the edge from the top-left corner
    s = wrap(s);
    if (s < w) return [x0 + s, y0];
    if (s < w + ht) return [x1, y0 + s - w];
    if (s < 2 * w + ht) return [x1 - (s - w - ht), y1];
    return [x0, y1 - (s - 2 * w - ht)];
  };
  const legs = Object.entries(frameConfig.coxae).map(([name, [x, y]]) => {
    const [dx, dy] = toScreen(x, y, frameConfig.front);
    const tx = dx ? ((dx > 0 ? x1 : x0) - W / 2) / dx : Infinity;
    const ty = dy ? ((dy > 0 ? y1 : y0) - H / 2) / dy : Infinity;
    const k = Math.min(tx, ty), px = W / 2 + k * dx, py = H / 2 + k * dy;
    const s = tx < ty ? (dx > 0 ? w + (py - y0) : 2 * w + ht + (y1 - py))
                      : (dy < 0 ? px - x0 : w + ht + (x1 - px));
    return { name, s };
  }).sort((a, b) => a.s - b.s);

  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.replaceChildren();
  framePaths = {};
  legs.forEach((leg, i) => {
    const prev = legs[(i + legs.length - 1) % legs.length].s, next = legs[(i + 1) % legs.length].s;
    const start = leg.s - (wrap(leg.s - prev) || P) / 2 + FRAME_GAP / 2;
    const length = (wrap(leg.s - prev) || P) / 2 + (wrap(next - leg.s) || P) / 2 - FRAME_GAP;
    const corners = [0, w, w + ht, 2 * w + ht].map((c) => wrap(c - start)).filter((o) => o < length).sort((a, b) => a - b);
    const points = [at(start), ...corners.map((o) => at(start + o)), at(start + length)];
    const path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("d", "M" + points.map((pt) => pt.map((v) => v.toFixed(1)).join(" ")).join(" L"));
    path.dataset.leg = leg.name;
    svg.append(path);
    framePaths[leg.name] = path;
  });
}

function renderFrame(s) {
  const known = linked && s.connected && s.telemetry_age_s >= 0 && s.telemetry_age_s < 2;
  for (const [name, path] of Object.entries(framePaths)) {
    path.setAttribute("class", !known ? "unknown" : (s.contacts || {})[name] ? "down" : "");
  }
}

function loadFrame() {
  fetch("/api/config").then((r) => r.json()).then((c) => {
    frameConfig = { coxae: c.coxae, front: (c.panel && c.panel.front) || "top" };
    drawFrame();
    if (lastState) renderFrame(lastState);
  }).catch(() => setTimeout(loadFrame, 2000));
}
addEventListener("resize", () => { drawFrame(); if (lastState) renderFrame(lastState); });

function render(s) {
  lastState = s;
  renderFrame(s);
  const v = s.volts, box = $("volts-box");
  $("volts").textContent = fmt(v, 2);
  box.className = "volts" + (v === null ? "" : v < 6.0 ? " dead" : v < 6.4 ? " low" : "");
  $("volts-note").textContent =
    v === null ? "no telemetry" : v < 6.0 ? "battery flat, shut down" : v < 6.4 ? "battery low" :
    s.telemetry_age_s > 2 ? `telemetry ${s.telemetry_age_s.toFixed(0)} s old` : "battery";

  $("amps").textContent = fmt(s.amps, 2);
  $("ip").textContent = s.ip || "no network";

  $("state").textContent = s.state;
  $("state").className = s.state;
  $("stop").classList.toggle("latched", s.estopped);
  $("stop").textContent = s.estopped ? "STOPPED" : "STOP";

  const imu = s.imu || {};
  const pitch = imu.pitch ?? 0, roll = imu.roll ?? 0;
  $("att").setAttribute("transform", `translate(0 ${pitch * PX_PER_DEG}) rotate(${-roll})`);
  $("att").style.opacity = imu.ok ? 1 : 0.35;
  $("pitch").textContent = imu.ok ? `${pitch.toFixed(1)}°` : imu.calibrating ? "cal…" : "--";
  $("roll").textContent = imu.ok ? `${roll.toFixed(1)}°` : "--";

  const problems = [];
  if (s.safety_trip) problems.push(`trip: ${s.safety_trip}`);
  if (!s.connected) problems.push(s.error ? `board: ${s.error}` : "board offline");
  if (!imu.ok && !imu.calibrating && imu.error) problems.push(`imu: ${imu.error}`);
  else if (imu.read_failures) problems.push(`imu: ${imu.read_failures} bus errors, check leads`);
  if (s.camera && !s.camera.ok) problems.push(`camera: ${s.camera.error || "off"}`);
  $("err").textContent = problems.join(" · ");
  $("err").title = $("err").textContent;
}

$("stop").addEventListener("pointerdown", () => {
  fetch("/stop", { method: "POST" }).catch(() => {});
  if (sock && sock.readyState === 1) sock.send("stop");
});

connect();
loadFrame();
</script>
</body>
</html>
