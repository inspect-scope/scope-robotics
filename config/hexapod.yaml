# Hexapod configuration for the Pi-side stack.
#
# Servo channels, calibration and geometry are ported from MakeYourPet's
# chica-config-2040.txt. The P-numbers in that file are the same integers the
# Servo2040 firmware uses as protocol channel indices, so `channel: 15` here is
# `P15` there.
#
# The stance block is *ours*, not a bit-exact copy of Chica's MODE_STANDARD.
# The numbers are derived from MODE_STANDARD's radius/angle/elongation and land
# every foot ~138.5 mm out from its own coxa, which is what those constants were
# tuned to do.

serial:
  port: /dev/ttyACM0       # Pi: usually ttyACM0. macOS: /dev/tty.usbmodem*
  baudrate: 115200         # ignored by USB CDC, kept because pyserial wants it
  timeout_s: 0.05

control:
  rate_hz: 50              # servo update rate
  telemetry_hz: 5          # how often to GET volts/amps/touch
  watchdog_ms: 300         # no fresh servo frame for this long -> torque off

limits:
  # Hard clamp on anything sent to a servo channel. With Chica's 2000/1000
  # calibration this is +/-81 deg of servo travel. Most 35kg digital servos take
  # 500-2500us; narrow this if yours buzz or stall at the ends.
  pulse_us: [600, 2400]
  # Joint limits, chosen to sit just inside what pulse_us can actually reach so
  # the two clamps agree. `hexapod check` flags them if they drift apart.
  coxa_deg: [-50, 50]
  femur_deg: [-35, 115]
  tibia_deg: [30, 148]

geometry:
  # Leg segment lengths, mm (COXA_LEN / FEMUR_LEN / TIBIA_LEN).
  coxa_len: 43
  femur_len: 80
  tibia_len: 134
  # Where the legs meet the frame, relative to the body origin (LEG_CONNECTION_Z).
  leg_connection_z: -10
  # Angle between servo horn and leg segment with the servo centred, degrees.
  coxa_attach_angle: -8
  femur_attach_angle: 35
  tibia_attach_angle: 68

stance:
  ride_height: 80          # body origin above the feet when standing, mm
  sit_height: 40           # ditto when sat down (LEG_SITTING_Z)
  step_lift: 40            # peak foot lift during swing, mm
  cycle_s: 0.8             # one full gait cycle
  max_speed: 120           # mm/s of body translation at full stick
  max_yaw_rate: 45         # deg/s at full stick
  max_stride: 90           # cap on stance stroke length, mm
  min_foot_depth: 25       # feet stay at least this far below the body plane, mm

# Body frame: +X right, +Y forward, +Z up, origin at the centre of the leg
# connection plane. `coxa` is the coxa rotation centre; `neutral` is where the
# foot sits when standing still; `yaw` is the direction the leg points, degrees
# CCW from +X. Feet sit at z = -ride_height.
legs:
  R1: {coxa: [ 63.0,  83.5], yaw:   63.0, neutral: [ 126.2,  207.2]}
  R2: {coxa: [ 81.5,   0.0], yaw:    0.0, neutral: [ 220.0,    0.0]}
  R3: {coxa: [ 63.0, -83.5], yaw:  -63.0, neutral: [ 126.2, -207.2]}
  L1: {coxa: [-63.0,  83.5], yaw:  117.0, neutral: [-126.2,  207.2]}
  L2: {coxa: [-81.5,   0.0], yaw:  180.0, neutral: [-220.0,    0.0]}
  L3: {coxa: [-63.0, -83.5], yaw: -117.0, neutral: [-126.2, -207.2]}

# Tripod gait groups. Legs in the same group swing together.
tripod_groups: [[L1, R2, L3], [R1, L2, R3]]

# [servo name] -> channel + the two calibration pulse widths from Chica's
# config: microseconds at -45 deg and at +45 deg. Direction is baked into these
# two numbers; 2000/1000 means positive angle -> shorter pulse.
# `direction` flips the *joint angle* sign before calibration is applied. Set it
# during bring-up with `hexapod jog`, one joint at a time.
servos:
  L1: {coxa: {channel: 15, us_neg45: 2000, us_pos45: 1000, direction:  1},
       femur: {channel: 16, us_neg45: 2000, us_pos45: 1000, direction:  1},
       tibia: {channel: 17, us_neg45: 2000, us_pos45: 1000, direction:  1}}
  L2: {coxa: {channel:  9, us_neg45: 2000, us_pos45: 1000, direction:  1},
       femur: {channel: 10, us_neg45: 2000, us_pos45: 1000, direction:  1},
       tibia: {channel: 11, us_neg45: 2000, us_pos45: 1000, direction:  1}}
  L3: {coxa: {channel:  3, us_neg45: 2000, us_pos45: 1000, direction:  1},
       femur: {channel:  4, us_neg45: 2000, us_pos45: 1000, direction:  1},
       tibia: {channel:  5, us_neg45: 2000, us_pos45: 1000, direction:  1}}
  R1: {coxa: {channel: 12, us_neg45: 2000, us_pos45: 1000, direction:  1},
       femur: {channel: 13, us_neg45: 2000, us_pos45: 1000, direction:  1},
       tibia: {channel: 14, us_neg45: 2000, us_pos45: 1000, direction:  1}}
  R2: {coxa: {channel:  6, us_neg45: 2000, us_pos45: 1000, direction:  1},
       femur: {channel:  7, us_neg45: 2000, us_pos45: 1000, direction:  1},
       tibia: {channel:  8, us_neg45: 2000, us_pos45: 1000, direction:  1}}
  R3: {coxa: {channel:  0, us_neg45: 2000, us_pos45: 1000, direction:  1},
       femur: {channel:  1, us_neg45: 2000, us_pos45: 1000, direction:  1},
       tibia: {channel:  2, us_neg45: 2000, us_pos45: 1000, direction:  1}}

# Foot contact switches. Channels 18..23 are TS1..TS6 on the wire.
touch_sensors:
  L1: {channel: 23, active_high: true}
  L2: {channel: 21, active_high: true}
  L3: {channel: 19, active_high: true}
  R1: {channel: 22, active_high: true}
  R2: {channel: 20, active_high: true}
  R3: {channel: 18, active_high: true}
  threshold_v: 1.6         # above this counts as asserted

# GY-521 (MPU-6050) on the Pi's i2c bus. Wiring and checks are in the README.
# axis_map turns the chip's axes into the body frame (+X right, +Y forward,
# +Z up): each entry is the chip axis pointing along that body axis, with an
# optional minus sign. Set it once the board is bolted down, checking that the
# horizon on /status tilts the same way the robot does.
imu:
  enabled: true
  bus: 1
  address: 0x68            # 0x69 if AD0 is pulled high
  bias_seconds: 2.0        # gyro bias average at startup; the robot must be still
  axis_map: [x, y, z]
  smoothing: 0.3           # weight of each new tilt sample, 1 = no smoothing
  bus_retries: 2           # extra attempts per i2c transaction after an Errno 121

# Pi camera through Picamera2. Both streams run at once, so a still never
# interrupts the live view. `still` is the sensor's full frame (Camera Module 3).
camera:
  enabled: true
  lores: [640, 360]        # live view
  still: [4608, 2592]      # stills
  stream_fps: 15
  jpeg_quality: 85         # stills; the stream uses the encoder's default
  buffers: 2               # full-res frames in flight; each is ~35 MB of CMA
  survey_dir: ~/surveys    # stills go in survey_dir/<session timestamp>/
  rotation: 180            # camera is mounted upside down. 0 or 180, nothing else
