[project]
name = "scope-hexapod"
version = "0.1.0"
description = "Pi-side server and web client for a MakeYourPet hexapod, replacing the Chica Android apps"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2"]

[project.scripts]
hexapod = "hexapod.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hexapod"]

[tool.setuptools.package-data]
hexapod = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
